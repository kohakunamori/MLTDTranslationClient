name: Validate Client Built-in Repository

on:
  push:
    branches: [ main ]
    paths:
      - 'localization/**'
      - 'manifests/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/validate-client.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer commit on the branch supersedes this validation run. External pull
  # requests are no longer accepted, so the maintainer's push is the only entry point.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifests and schemas
        run: python scripts/validate_repo.py

      - name: Build portal resource manifest
        run: python scripts/build_portal_resource_manifest.py

      - name: Publish portal resource manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- manifests/portal-resource-manifest.json; then
            echo 'Portal manifest is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/portal-resource-manifest.json
          git commit -m 'ci(client): refresh portal resource manifest [skip ci]'
          git push origin HEAD:main
