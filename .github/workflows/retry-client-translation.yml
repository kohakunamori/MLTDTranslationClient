name: Retry incomplete Client translation
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Auto-translate Client resources]
    types: [completed]
    branches: [main]
permissions:
  actions: write
concurrency:
  group: client-translation-retry
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume the failed translation job from its saved source progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          repository = os.environ['GITHUB_REPOSITORY']
          if os.environ['GITHUB_EVENT_NAME'] != 'workflow_run':
              listing = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/actions/workflows/llm-translate-client.yml/runs?branch=main&per_page=1'], text=True))
              runs = listing.get('workflow_runs') or []
              if not runs:
                  raise SystemExit(0)
              trigger = runs[0]
          else:
              trigger = event['workflow_run']
          run_id = trigger['id']
          if type(run_id) is not int or run_id <= 0:
              raise SystemExit('Invalid translation run ID')
          endpoint = f'repos/{repository}/actions/runs/{run_id}'
          current = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          if (current.get('id') != run_id or current.get('run_attempt') != trigger['run_attempt']
                  or current.get('repository', {}).get('full_name') != repository
                  or current.get('head_repository', {}).get('full_name') != repository
                  or current.get('head_branch') != 'main'
                  or current.get('path') != '.github/workflows/llm-translate-client.yml'
                  or current.get('status') != 'completed' or current.get('conclusion') != 'failure'
                  or type(current.get('run_attempt')) is not int or not 1 <= current['run_attempt'] < 3):
              print('Translation attempt already advanced or is not eligible for retry.')
          else:
              subprocess.run(['gh', 'api', '--method', 'POST', endpoint + '/rerun-failed-jobs'], check=True)
              print(f"Requested translation attempt {current['run_attempt'] + 1}/3.")
          PY
