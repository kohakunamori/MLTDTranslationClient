name: Sync latest APK and auto-translate Client resources

on:
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Optional queue limit for a smoke run'
        required: false
        default: '0'
      smoke_test:
        description: 'Send one synthetic row to verify provider credentials without changing sources'
        required: false
        type: boolean
        default: false
      retry_build:
        description: 'Notify Private Build even when resources are unchanged; its deduplication still applies'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: client-llm-translation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}/.translation-engine

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Client sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Checkout private APK extraction tooling
        if: inputs.smoke_test != true
        uses: actions/checkout@v4
        with:
          repository: kohakunamori/MLTDModifiedAPK
          ref: main
          token: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          path: .apk-tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-apk-probe.txt
            requirements-client-ci.txt
            requirements-provider.txt

      - name: Restore reviewed catalogue client
        if: inputs.smoke_test != true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/client-apk-source/gamestoday.apk
          key: hotplay-store-v1-${{ hashFiles('.apk-tools/client/hotplay_source.py') }}

      - name: Install lightweight catalogue dependencies
        if: inputs.smoke_test != true
        run: python -m pip install --disable-pip-version-check -r requirements-apk-probe.txt

      - name: Check publisher catalogue before acquiring APKs
        id: preflight
        if: inputs.smoke_test != true
        working-directory: .apk-tools
        run: |
          python -m client.apk_sync_preflight \
            --client-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/client-apk-source" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install APK extraction dependencies only for changed inputs
        if: steps.preflight.outputs.extraction_required == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-client-ci.txt

      - name: Acquire latest publisher-signed APK and extract BI sources
        id: sync
        if: steps.preflight.outputs.extraction_required == 'true'
        working-directory: .apk-tools
        shell: bash
        run: |
          set -euo pipefail
          python -m client.apk_resource_sync sync \
            --client-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/client-apk-source" \
            --github-output "$GITHUB_OUTPUT"

      - name: Collect untranslated Client rows
        id: collect
        shell: bash
        env:
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_TEST" = true ]; then
          python - .llm-queue.jsonl <<'PY'
          import hashlib, json, pathlib, sys
          source = "プロバイダ疎通テスト"
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "source": source,
              "source_sha256": hashlib.sha256(source.encode()).hexdigest(),
              "bundle": "smoke-test",
              "key": "smoke-test",
              "task": "UI",
              "translation": "",
              "status": "pending",
          }, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          else
            python scripts/llm_translate_untranslated.py collect --output .llm-queue.jsonl
          fi
          echo "items=$(wc -l < .llm-queue.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Checkout translation engine only for a nonempty queue
        if: steps.collect.outputs.items != '0'
        uses: actions/checkout@v4
        with:
          repository: kohakunamori/MLTDTranslationAssets
          ref: main
          path: .translation-engine
          fetch-depth: 1

      - name: Install provider dependencies only for a nonempty queue
        if: steps.collect.outputs.items != '0'
        run: python -m pip install --disable-pip-version-check -r requirements-provider.txt

      - name: Materialize provider configuration from secrets
        if: steps.collect.outputs.items != '0'
        shell: bash
        env:
          MLTD_LLM_API_KEY: ${{ secrets.MLTD_LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MLTD_LLM_API_KEY"
          cfg_dir="$RUNNER_TEMP/mltd-llm"
          install -d -m 700 "$cfg_dir"
          cp .translation-engine/configs/api-models.example.json "$cfg_dir/api-models.local.json"
          cp .translation-engine/configs/api-models.presets.example.json "$cfg_dir/api-models.presets.json"
          python - "$cfg_dir/api-runtime.local.json" "$MLTD_LLM_API_KEY" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema_version": 3,
              "environment": {"api_key": {"MLTD_API_KEY": sys.argv[2]}},
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          chmod 600 "$cfg_dir"/*
          echo "MLTD_LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"
          echo "LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"

      - name: Prepare project prompt inputs
        if: steps.collect.outputs.items != '0'
        run: printf '%s\n' '{"schema_version":1,"speakers":{}}' > .llm-character-evidence.json

      - name: Translate with the shared provider pool
        id: translate
        if: steps.collect.outputs.items != '0'
        # Preserve extracted sources and any completed drafts even if a provider
        # run fails; the next run resumes from the still-empty catalogue rows.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input .llm-queue.jsonl
            --output .llm-draft.jsonl
            --failed-output .llm-failed.jsonl
            --summary .llm-summary.json
            --config "$MLTD_LLM_CONFIG_PATH"
            --no-default-resume
            --batch-mode single
            --glossary .translation-engine/glossary/authoritative-terms.json
            --authoritative-terms .translation-engine/glossary/authoritative-terms.json
            --character-evidence .llm-character-evidence.json
            --prompt-source compiled
            --system-prompt .llm-system-prompt.md
            --prompt-manifest .translation-engine/pipelines/text/configs/mltd-zhcn-system.manifest.json
          )
          limit='${{ inputs.max_items }}'
          if [ -n "$limit" ] && [ "$limit" != 0 ]; then args+=(--max-items "$limit"); fi
          python .translation-engine/pipelines/text/translate_mltd_api_pool.py "${args[@]}"

      - name: Apply and validate LLM translations
        shell: bash
        env:
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_TEST" = true ]; then python scripts/validate_repo.py; exit 0; fi
          if [ ! -f .llm-draft.jsonl ]; then
            echo 'No draft output.'
            python scripts/validate_repo.py
            exit 0
          fi
          python scripts/llm_translate_untranslated.py apply --draft .llm-draft.jsonl
          python scripts/validate_repo.py

      - name: Refresh Client portal summary
        if: inputs.smoke_test != true
        run: python scripts/build_portal_resource_manifest.py

      - name: Commit synchronized APK sources and translations to main
        id: publish
        if: inputs.smoke_test != true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- localization manifests)" ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No source changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization manifests
          git commit -m 'ci(client): sync official APK and apply LLM translations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
            python scripts/validate_repo.py
          done

      # GITHUB_TOKEN pushes do not trigger the separate push notifier. Dispatch
      # directly after changed sources. The private daily poll recovers missed
      # notifications; retry_build also permits an explicit no-change retry.
      - name: Dispatch the exact translated Client commit to Private Build
        if: inputs.smoke_test != true && (steps.sync.outputs.build_supported || steps.preflight.outputs.build_supported) == 'true' && steps.translate.outcome != 'failure' && (steps.publish.outputs.changed == 'true' || inputs.retry_build == true)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ github.repository }}
          CLIENT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python scripts/dispatch_private_build.py --repository "$CLIENT_REPOSITORY" --commit "$CLIENT_COMMIT" --require-ready

      - name: Report provider failure after saving source progress
        if: steps.translate.outcome == 'failure'
        run: |
          echo '::error::Translation provider failed. Extracted sources and completed valid translations were preserved; the next run continues the empty rows. No APK build was dispatched.'
          exit 1

      - name: Request native recovery for a new unsupported official APK
        if: inputs.smoke_test != true && (steps.sync.outputs.build_supported || steps.preflight.outputs.build_supported) == 'false' && steps.translate.outcome != 'failure' && (steps.publish.outputs.changed == 'true' || inputs.retry_build == true)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ github.repository }}
          CLIENT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python scripts/dispatch_private_build.py --repository "$CLIENT_REPOSITORY" --commit "$CLIENT_COMMIT" --recover-unsupported --require-ready

      - name: Report unsupported native version
        if: inputs.smoke_test != true && (steps.sync.outputs.build_supported || steps.preflight.outputs.build_supported) == 'false'
        run: |
          echo '::error::Latest APK translations were saved. Native recovery is routed to Private Build; unchanged stages are deduplicated there. Publication waits for a validated clean ELF and matching native target.'
          exit 1

      - name: Upload translation diagnostics
        if: always() && (steps.preflight.outputs.extraction_required == 'true' || steps.collect.outputs.items != '0')
        uses: actions/upload-artifact@v4
        with:
          name: client-translation-report-${{ github.run_id }}
          path: |
            .llm-summary.json
            .llm-failed.jsonl
            manifests/apk-source-state.json
          if-no-files-found: ignore
          retention-days: 7
