# RackNerd dispatches these labeled jobs one at a time under CPU/memory limits.
name: Auto-translate Client resources

on:
  repository_dispatch:
    types: [apk-text-discovered, apk-source-discovered]
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Optional queue limit for a smoke run'
        required: false
        default: '0'
      smoke_test:
        description: 'Send one synthetic row to verify provider credentials without changing sources'
        required: false
        type: boolean
        default: false
      retry_build:
        description: 'Notify Private Build even when resources are unchanged; its deduplication still applies'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: client-llm-translation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}/.translation-engine

jobs:
  draft:
    runs-on: [self-hosted, Linux, X64, racknerd-light]
    timeout-minutes: 90
    steps:
      - name: Checkout Client sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-provider.txt

      - name: Import source-bound text discovered by private candidate CI
        if: github.event_name == 'repository_dispatch' && github.event.action == 'apk-text-discovered'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
        run: python -m scripts.apk_text_requests import

      - name: Import the text queue scanned by Private Build
        if: inputs.smoke_test != true
        run: python -m scripts.apk_text_requests import-local-scan

      - name: Verify the private source discovery notification
        if: github.event.action == 'apk-source-discovered'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
        run: python -m scripts.apk_text_requests validate-source-event

      - name: Read APK support from the received source manifest
        id: source
        if: inputs.smoke_test != true
        run: |
          python - <<'PY'
          import json, os, pathlib
          state = json.loads(pathlib.Path('manifests/apk-source-state.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('build_supported=' + str(state['build_supported']).lower() + '\n')
          PY

      - name: Collect untranslated Client rows
        id: collect
        shell: bash
        env:
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_TEST" = true ]; then
          python - .llm-queue.jsonl <<'PY'
          import hashlib, json, pathlib, sys
          source = "プロバイダ疎通テスト"
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "source": source,
              "source_sha256": hashlib.sha256(source.encode()).hexdigest(),
              "bundle": "smoke-test",
              "key": "smoke-test",
              "task": "UI",
              "translation": "",
              "status": "pending",
          }, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          else
            python -m scripts.llm_translate_untranslated collect --output .llm-queue.jsonl
          fi
          echo "items=$(wc -l < .llm-queue.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Checkout translation engine only for a nonempty queue
        if: steps.collect.outputs.items != '0'
        uses: actions/checkout@v4
        with:
          repository: kohakunamori/MLTDTranslationAssets
          ref: main
          path: .translation-engine
          fetch-depth: 1
          filter: blob:none
          # The provider consumes code, configuration and glossary only.
          sparse-checkout: |
            configs
            glossary
            pipelines

      - name: Install provider dependencies only for a nonempty queue
        if: steps.collect.outputs.items != '0'
        run: python -m pip install --disable-pip-version-check -r requirements-provider.txt

      - name: Verify the shared text provider imports without the bundle codec
        if: steps.collect.outputs.items != '0'
        # requirements-provider.txt (httpx, msgpack) is the entire environment in
        # this job: the engine's bundle codec and its encryption helpers are not
        # installed here. Importing the engine's text entry is the consumer's own
        # proof that the engine runs as published, and it fails on the offending
        # import line rather than halfway through a translation run. The engine
        # keeps the same invariant as a test of its own
        # (pipelines/text/test_provider_text_closure.py).
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib, sys
          for name in ('pipelines.text.translate_mltd_api_pool',
                       'pipelines.text.translate_gtx_queue',
                       'pipelines.text.mltd_translation_quality'):
              importlib.import_module(name)
          if 'pipelines.text.mltd_localize_gtx' in sys.modules:
              raise SystemExit('the text provider still imports the bundle codec')
          print('provider text closure is clean')
          PY
          python .translation-engine/pipelines/text/translate_mltd_api_pool.py --help > /dev/null

      - name: Materialize provider configuration from secrets
        if: steps.collect.outputs.items != '0'
        shell: bash
        env:
          MLTD_LLM_API_KEY: ${{ secrets.MLTD_LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MLTD_LLM_API_KEY"
          cfg_dir="$RUNNER_TEMP/mltd-llm"
          install -d -m 700 "$cfg_dir"
          cp .translation-engine/configs/api-models.example.json "$cfg_dir/api-models.local.json"
          cp .translation-engine/configs/api-models.presets.example.json "$cfg_dir/api-models.presets.json"
          python - "$cfg_dir/api-runtime.local.json" "$MLTD_LLM_API_KEY" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema_version": 3,
              "environment": {"api_key": {"MLTD_API_KEY": sys.argv[2]}},
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          chmod 600 "$cfg_dir"/*
          echo "MLTD_LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"
          echo "LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"

      - name: Prepare project prompt inputs
        if: steps.collect.outputs.items != '0'
        run: printf '%s\n' '{"schema_version":1,"speakers":{}}' > .llm-character-evidence.json

      - name: Translate with the shared provider pool
        id: translate
        if: steps.collect.outputs.items != '0'
        # Preserve extracted sources and any completed drafts even if a provider
        # run fails; the next run resumes from the still-empty catalogue rows.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input .llm-queue.jsonl
            --output .llm-draft.jsonl
            --failed-output .llm-failed.jsonl
            --summary .llm-summary.json
            --config "$MLTD_LLM_CONFIG_PATH"
            --no-default-resume
            --batch-mode single
            --glossary .translation-engine/glossary/authoritative-terms.json
            --authoritative-terms .translation-engine/glossary/authoritative-terms.json
            --character-evidence .llm-character-evidence.json
            --prompt-source compiled
            --system-prompt .llm-system-prompt.md
            --prompt-manifest .translation-engine/pipelines/text/configs/mltd-zhcn-system.manifest.json
          )
          limit='${{ inputs.max_items }}'
          if [ -n "$limit" ] && [ "$limit" != 0 ]; then args+=(--max-items "$limit"); fi
          python .translation-engine/pipelines/text/translate_mltd_api_pool.py "${args[@]}"

      - name: Apply and validate LLM translations
        shell: bash
        env:
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_TEST" = true ]; then python -m scripts.validate_repo; exit 0; fi
          if [ ! -f .llm-draft.jsonl ]; then
            echo 'No draft output.'
            python -m scripts.validate_repo
            exit 0
          fi
          python -m scripts.llm_translate_untranslated apply --draft .llm-draft.jsonl > .llm-apply-report.json
          python -m scripts.validate_repo

      - name: Refresh Client portal summary
        if: inputs.smoke_test != true
        run: python -m scripts.build_portal_resource_manifest

      - name: Commit Client text translations to main
        id: publish
        if: inputs.smoke_test != true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- localization manifests)" ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No source changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization manifests
          git commit -m 'ci(client): apply validated text translations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
            python -m scripts.validate_repo
          done

      # GITHUB_TOKEN pushes do not trigger the separate push notifier. Dispatch
      # directly after changed sources. There is no scheduled APK-build fallback;
      # retry_build or Notify private APK build permits an explicit no-change retry.
      - name: Resume completed candidate text requests with the exact Client commit
        if: inputs.smoke_test != true && steps.translate.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          CLIENT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python -m scripts.apk_text_requests callback --commit "$CLIENT_COMMIT"

      # The same merge window the push notifier uses, for the same reason and on the same free public
      # runner. A translation run commits and then dispatches directly, so a maintainer's push that
      # lands while this job is still working would otherwise buy a second build of the same content -
      # or, worse, this run would build content the newer push already superseded. Waiting here and
      # re-reading the branch head collapses the two entry points into one notification per content:
      # if a newer commit changed the artifact inputs, that commit's own push notifier is the one that
      # dispatches, and this run stands down. Anything the settle cannot prove dispatches.
      - name: Hold the notification for a merge window
        id: settle
        if: inputs.smoke_test != true && github.event.action != 'apk-text-discovered' && steps.translate.outcome != 'failure' && (steps.publish.outputs.changed == 'true' || inputs.retry_build == true || github.event.action == 'apk-source-discovered')
        shell: bash
        env:
          TARGET_SHA: ${{ steps.publish.outputs.commit }}
          # An explicit retry is a human asking for a build, so it is never held back.
          SETTLE_SECONDS: ${{ inputs.retry_build == true && '0' || vars.APK_DISPATCH_SETTLE_SECONDS || '600' }}
        run: |
          set -euo pipefail
          python -m scripts.dispatch_settle --root "$GITHUB_WORKSPACE" --github-output --json

      - name: Dispatch the exact translated Client commit to Private Build
        if: inputs.smoke_test != true && github.event.action != 'apk-text-discovered' && steps.source.outputs.build_supported == 'true' && steps.translate.outcome != 'failure' && steps.settle.outputs.dispatch != 'false' && (steps.publish.outputs.changed == 'true' || inputs.retry_build == true || github.event.action == 'apk-source-discovered')
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ github.repository }}
          CLIENT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python -m scripts.dispatch_private_build --repository "$CLIENT_REPOSITORY" --commit "$CLIENT_COMMIT" --require-ready

      - name: Report provider failure after saving source progress
        if: steps.translate.outcome == 'failure'
        run: |
          echo '::error::Translation provider failed. Extracted sources and completed valid translations were preserved; the next run continues the empty rows. No APK build was dispatched.'
          exit 1

      - name: Report rejected formatting after preserving valid progress
        if: inputs.smoke_test != true
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('.llm-apply-report.json')
          if path.exists() and json.loads(path.read_text()).get('rejected', 0):
              raise SystemExit('Formatting-invalid drafts were refused; pending text is retained for the next run.')
          PY

      - name: Request native recovery for a new unsupported official APK
        if: inputs.smoke_test != true && github.event.action != 'apk-text-discovered' && steps.source.outputs.build_supported == 'false' && steps.translate.outcome != 'failure' && steps.settle.outputs.dispatch != 'false' && (steps.publish.outputs.changed == 'true' || inputs.retry_build == true || github.event.action == 'apk-source-discovered')
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_BUILD_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ github.repository }}
          CLIENT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python -m scripts.dispatch_private_build --repository "$CLIENT_REPOSITORY" --commit "$CLIENT_COMMIT" --recover-unsupported --require-ready

      - name: Report unsupported native version
        if: inputs.smoke_test != true && github.event.action != 'apk-text-discovered' && steps.source.outputs.build_supported == 'false'
        run: |
          echo '::error::Latest APK translations were saved. Native recovery is routed to Private Build; unchanged stages are deduplicated there. Publication waits for a validated clean ELF and matching native target.'
          exit 1

      - name: Upload translation diagnostics
        if: always() && (github.event_name == 'repository_dispatch' || steps.collect.outputs.items != '0')
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: client-translation-report-${{ github.run_id }}
          path: |
            .llm-summary.json
            .llm-apply-report.json
            .llm-failed.jsonl
            manifests/apk-source-state.json
          if-no-files-found: ignore
          retention-days: 7
